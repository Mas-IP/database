<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131a">
  <meta name="description" content="Web Mas-IP All Hub — akses game dan fitur dalam satu tempat.">
  <title>Web Mas-IP — All Hub</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10131a;
      --panel: #171c25;
      --panel2: #1d2430;
      --line: #2c3442;
      --text: #e8edf5;
      --muted: #929dad;
      --blue: #6da7ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a { color: inherit; text-decoration: none; }

    main, footer {
      width: min(1000px, calc(100% - 36px));
      margin-inline: auto;
    }

    main {
      padding: 38px 0 24px;
    }

    .intro { margin-bottom: 30px; }

    .intro .tag {
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }

    .intro h1 {
      margin: 8px 0;
      font-size: clamp(27px, 4vw, 38px);
      letter-spacing: -1px;
      line-height: 1.2;
    }

    .intro p {
      max-width: 590px;
      margin: 0;
      color: var(--muted);
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 28px 0 12px;
    }

    .section-title h2 { margin: 0; font-size: 17px; }
    .section-title span { color: var(--muted); font-size: 12px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 13px;
    }

    .item {
      display: flex;
      min-width: 0;
      min-height: 190px;
      flex-direction: column;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }

    .item-top { display: flex; align-items: center; gap: 11px; }

    .icon {
      display: grid;
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      place-items: center;
      border-radius: 8px;
      background: var(--panel2);
      font-size: 21px;
    }

    .item h3 { margin: 0; font-size: 15px; }

    .item p {
      flex: 1;
      margin: 14px 0 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .btn {
      display: inline-flex;
      min-height: 37px;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel2);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    .btn.primary {
      border-color: var(--blue);
      background: var(--blue);
      color: #081321;
      font-weight: 700;
    }

    .btn:hover { filter: brightness(1.08); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }

    footer {
      display: grid;
      width: min(760px, calc(100% - 36px));
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px;
      margin-top: 0;
      padding: 14px 0 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .credit-left { justify-self: end; text-align: right; }
    .credit-center { justify-self: center; text-align: center; }
    .credit-right { justify-self: start; text-align: left; }

    .item {
      transition: transform 180ms ease, border-color 180ms ease, background-color 180ms ease, box-shadow 180ms ease;
    }

    .item:hover {
      transform: translateY(-3px);
      border-color: #3b4b63;
      box-shadow: 0 8px 22px rgb(0 0 0 / 16%);
    }

    .btn {
      transition: transform 140ms ease, filter 140ms ease, background-color 140ms ease, border-color 140ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn:active, .btn.is-clicking { transform: scale(.97); filter: brightness(.94); }
    .item.is-opening { transform: scale(.985); border-color: var(--blue); }

    @media (max-width: 760px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    @media (max-width: 500px) {
      main { padding-top: 28px; }
      .grid { grid-template-columns: 1fr; }
      .item { min-height: 0; }
      .item p { margin-bottom: 14px; }
      .actions .btn { flex: 1; }
      footer {
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 5px;
        text-align: center;
      }
      .credit-left, .credit-center, .credit-right {
        justify-self: center;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="intro">
      <div class="tag">Web Mas-IP All IN</div>
      <h1>Fiture &amp; game</h1>
      <p>Pilih fitur yang mau dibuka.</p>
    </section>

    <div class="section-title">
      <h2>Daftar fitur</h2>
      <span id="count">0 fitur</span>
    </div>

    <section id="features" class="grid" aria-label="Daftar fitur"></section>
  </main>

  <footer>
    <span class="credit-left">Web All Hub</span>
    <span class="credit-center">© 2026 Mas-IP</span>
    <span class="credit-right">Hosted on Website pages</span>
  </footer>

  <script>
    // Ubah URL di sini untuk mengarahkan tombol ke halaman fitur yang diinginkan.
    const FEATURES = [
      {
        id: 'sosmed',
        name: 'Sosial Media',
        description: 'All-in-one sosial media dari dev Mas-IP.',
        icon: '🌐',
        url: './web/sosmed/index2.html'
      },
      {
        id: 'dino',
        name: 'Dino Mlayu',
        description: 'Game lari menghindari rintangan.',
        icon: '🦖',
        url: './game/dino/index.html'
      },
      {
        id: 'tictactoe',
        name: 'Tic Tac Toe',
        description: 'Main X dan O di papan 3×3 infinity.',
        icon: '⭕',
        url: './game/tictactoe/index6.html'
      },
      {
        id: 'bola',
        name: 'Endi Bolane',
        description: 'Game dengan ritme cepat dan acak.',
        icon: '🥛',
        url: './game/bola/index.html'
      },
      {
        id: 'catur',
        name: 'Catur Arena',
        description: 'Mainkan Catur dengan strategi dan mengasah otak.',
        icon: '♟️',
        url: './game/catur/index.html'
      },
      {
        id: 'dash',
        name: 'Dash Game',
        description: 'Game platform dengan ritme cepat.',
        icon: '⚡',
        url: './game/dash/index.html'
      }
    ];

    function renderFeatures() {
      const root = document.querySelector('#features');
      const count = document.querySelector('#count');
      root.replaceChildren();
      count.textContent = `${FEATURES.length} fitur`;

      for (const item of FEATURES) {
        const card = document.createElement('article');
        card.className = 'item';

        const top = document.createElement('div');
        top.className = 'item-top';

        const icon = document.createElement('div');
        icon.className = 'icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.textContent = item.icon;

        const titleWrap = document.createElement('div');
        const title = document.createElement('h3');
        title.textContent = item.name;
        titleWrap.append(title);
        top.append(icon, titleWrap);

        const description = document.createElement('p');
        description.textContent = item.description;

        const actions = document.createElement('div');
        actions.className = 'actions';

        const open = document.createElement('a');
        open.className = 'btn primary';
        open.href = item.url;
        open.textContent = 'Buka fitur ↗';
        open.setAttribute('aria-label', `Buka fitur ${item.name}`);
        open.addEventListener('click', (event) => {
          // Biarkan browser menangani buka tab baru, klik tengah, dan shortcut modifier.
          if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
          event.preventDefault();
          card.classList.add('is-opening');
          open.classList.add('is-clicking');
          const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          window.setTimeout(() => window.location.assign(open.href), reduceMotion ? 0 : 120);
        });

        actions.append(open);
        card.append(top, description, actions);
        root.append(card);
      }
    }

    renderFeatures();
  </script>
</body>
</html>
