<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dino Runner - Simple</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --panel: #16213e;
            --accent: #e94560;
            --text: #eee;
            --text2: #aaa;
            --green: #2ecc71;
            --red: #e74c3c;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --btn-radius: 10px;
            --transition: 0.25s ease;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 20% 50%, #1a1a3e 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, #1e2a4a 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, #0d1b2a 0%, transparent 60%);
            color: var(--text);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        #app {
            width: min(880px, 100%);
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* Header */
        #header {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--panel);
            border-radius: var(--radius);
            padding: 10px 18px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }
        #header .logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
        }
        #header .logo span {
            color: var(--accent);
        }

        /* Screens */
        .screen {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .screen.active {
            display: flex;
        }

        /* Start screen */
        #startScreen .start-card {
            background: var(--panel);
            border-radius: var(--radius);
            padding: 30px 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
        }
        #startScreen .start-card h2 {
            font-size: 30px;
            margin-bottom: 6px;
            color: #fff;
        }
        #startScreen .start-card .sub {
            color: var(--text2);
            font-size: 14px;
            margin-bottom: 22px;
        }
        .btn {
            padding: 12px 24px;
            border-radius: var(--btn-radius);
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.5px;
            width: 100%;
            text-align: center;
            margin-bottom: 8px;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 16px rgba(233, 69, 96, 0.35);
        }
        .btn-primary:hover {
            background: #d63851;
        }
        .btn-secondary {
            background: var(--panel);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-secondary:hover {
            background: #1a2a4a;
        }

        /* Game screen */
        #gameScreen {
            gap: 8px;
        }
        #gameWrapper {
            position: relative;
            width: 100%;
            max-width: 820px;
            background: #f7f7f7;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 3px solid #222;
            aspect-ratio: 820 / 400;
            flex-shrink: 0;
        }
        #gameWrapper canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #gameHUD {
            position: absolute;
            top: 12px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-weight: 700;
            font-size: 15px;
            color: #222;
            z-index: 5;
        }
        #gameOverlay {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(247, 247, 247, 0.92);
            text-align: center;
            z-index: 10;
            padding: 16px;
        }
        #gameOverlay.active {
            display: flex;
        }
        #gameOverlay h2 {
            font-size: 32px;
            color: #222;
            margin-bottom: 6px;
        }
        #gameOverlay .final-score {
            font-size: 20px;
            color: #333;
            margin-bottom: 4px;
        }
        #gameOverlay .final-score strong {
            color: var(--accent);
            font-size: 28px;
        }
        #gameOverlay .highscore-msg {
            font-size: 14px;
            color: var(--text2);
            font-weight: 600;
            margin-bottom: 14px;
        }
        #gameOverlay .btn {
            max-width: 220px;
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #222;
            color: #fff;
            padding: 12px 22px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 999;
            pointer-events: none;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Responsive */
        @media (max-width: 600px) {
            body {
                padding: 6px;
            }
            #app {
                gap: 6px;
            }
            #header {
                padding: 8px 12px;
            }
            #header .logo {
                font-size: 16px;
            }
            #gameWrapper {
                border-radius: 10px;
                border-width: 2px;
                aspect-ratio: auto;
                height: min(45vh, 280px);
            }
            #gameHUD {
                font-size: 12px;
                top: 8px;
                left: 10px;
                right: 10px;
            }
            #gameOverlay h2 {
                font-size: 24px;
            }
            #gameOverlay .final-score strong {
                font-size: 22px;
            }
            .btn {
                padding: 10px 16px;
                font-size: 13px;
            }
            #startScreen .start-card {
                padding: 20px 16px;
            }
        }
        @media (max-width: 400px) {
            #gameWrapper {
                height: min(38vh, 220px);
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- HEADER -->
        <div id="header">
            <div class="logo">🦖 DINO<span>RUNNER</span></div>
        </div>

        <!-- START SCREEN -->
        <div class="screen active" id="startScreen">
            <div class="start-card">
                <h2>🦖 Dino Runner</h2>
                <div class="sub">Lompat dan hindari rintangan!<br>Awan muncul setelah skor 200.</div>
                <button class="btn btn-primary" id="startBtn">🎮 MAIN</button>
                <div class="sub" style="font-size:12px;color:#888;margin-top:10px;">
                    Tap layar atau tekan SPACE untuk lompat
                </div>
            </div>
        </div>

        <!-- GAME SCREEN -->
        <div class="screen" id="gameScreen">
            <div id="gameWrapper">
                <canvas id="canvas"></canvas>
                <div id="gameHUD">
                    <span>🦖 DINO</span>
                    <span>Score: <span id="score">0</span></span>
                </div>
                <div id="gameOverlay">
                    <h2>💥 GAME OVER</h2>
                    <div class="final-score">Skor: <strong id="finalScore">0</strong></div>
                    <div class="highscore-msg" id="highscoreMsg"></div>
                    <button class="btn btn-primary" id="retryBtn">🔄 MAIN LAGI</button>
                    <button class="btn btn-secondary" id="menuBtn">🏠 MENU</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast"></div>

    <script>
        "use strict";

        /* =====================================================
           SOUND ENGINE (Web Audio API)
        ===================================================== */
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new(window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        function playTone(freq, duration, type = 'square', vol = 0.12, freqEnd = null) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                if (freqEnd) {
                    osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
                }
                gain.gain.setValueAtTime(vol, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + duration + 0.02);
            } catch (e) { /* silent fail */ }
        }

        function playJumpSound() {
            playTone(250, 0.12, 'square', 0.1, 520);
            playTone(180, 0.08, 'triangle', 0.08, 400);
        }

        function playCollisionSound() {
            playTone(200, 0.18, 'sawtooth', 0.14, 60);
            playTone(150, 0.2, 'square', 0.1, 40);
            playTone(100, 0.25, 'triangle', 0.12, 30);
        }

        function playGameOverSound() {
            playTone(400, 0.15, 'square', 0.1, 300);
            setTimeout(() => playTone(300, 0.15, 'square', 0.1, 200), 150);
            setTimeout(() => playTone(200, 0.25, 'sawtooth', 0.12, 80), 300);
            setTimeout(() => playTone(120, 0.4, 'triangle', 0.14, 50), 500);
        }

        function playScoreMilestoneSound() {
            playTone(600, 0.06, 'sine', 0.06, 900);
            playTone(800, 0.05, 'sine', 0.05, 1200);
        }

        function playClickSound() {
            playTone(500, 0.04, 'sine', 0.05, 700);
        }

        /* =====================================================
           TOAST
        ===================================================== */
        let toastTimeout = null;

        function showToast(message, duration = 2200) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        /* =====================================================
           SCREENS
        ===================================================== */
        const startScreen = document.getElementById('startScreen');
        const gameScreen = document.getElementById('gameScreen');

        function showScreen(name) {
            startScreen.classList.toggle('active', name === 'start');
            gameScreen.classList.toggle('active', name === 'game');
        }

        /* =====================================================
           GAME ENGINE
        ===================================================== */
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const gameWrapper = document.getElementById('gameWrapper');
        const scoreElement = document.getElementById('score');
        const finalScoreElement = document.getElementById('finalScore');
        const highscoreMsg = document.getElementById('highscoreMsg');
        const gameOverlay = document.getElementById('gameOverlay');

        let width = 820;
        let height = 400;
        let running = false;
        let gameOver = false;
        let score = 0;
        let speed = 6;
        let lastTime = 0;
        let obstacleTimer = 0;
        let nextObstacle = 1000;
        let obstacles = [];
        let clouds = [];
        let lastScoreMilestone = 0;
        let highScore = 0;
        const groundHeight = 60;

        // Load high score from localStorage
        try {
            highScore = parseInt(localStorage.getItem('dino_simple_highscore') || '0');
        } catch (e) { highScore = 0; }

        const dino = {
            x: 70,
            y: 0,
            width: 50,
            height: 58,
            velocityY: 0,
            gravity: 0.9,
            jumpPower: -16.5,
            grounded: true
        };

        function resizeCanvas() {
            const rect = gameWrapper.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = rect.width;
            height = rect.height;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            resetDino();
            draw();
        }

        function getGroundY() {
            return height - groundHeight;
        }

        function resetDino() {
            dino.x = Math.max(40, width * 0.08);
            dino.y = getGroundY() - dino.height;
            dino.velocityY = 0;
            dino.grounded = true;
        }

        function createObstacle() {
            // Decide obstacle type: cactus always, cloud only if score > 200
            const canHaveCloud = score > 200;
            const cloudChance = canHaveCloud ? 0.3 : 0; // 30% chance for cloud after 200
            const isCloud = canHaveCloud && Math.random() < cloudChance;

            if (isCloud) {
                const obstacle = {
                    type: 'cloud',
                    x: width + 30,
                    width: 45 + Math.random() * 15, // 45-60
                    height: 30 + Math.random() * 10, // 30-40
                    speedMultiplier: 1 + Math.random() * 0.2,
                };
                obstacle.y = getGroundY() - obstacle.height - 15; // floating above ground
                obstacles.push(obstacle);
            } else {
                const small = Math.random() < 0.75;
                const obstacle = {
                    type: 'cactus',
                    x: width + 30,
                    width: small ? 24 : 40,
                    height: small ? 38 : 55,
                    speedMultiplier: 1
                };
                obstacle.y = getGroundY() - obstacle.height;
                obstacles.push(obstacle);
            }
        }

        function createClouds() {
            clouds = [];
            for (let i = 0; i < 5; i++) {
                clouds.push({
                    x: Math.random() * width,
                    y: 25 + Math.random() * 80,
                    width: 50 + Math.random() * 50,
                    speed: 0.3 + Math.random() * 0.4
                });
            }
        }
        createClouds();

        function resetGameState() {
            score = 0;
            speed = 6;
            obstacleTimer = 0;
            nextObstacle = 1000;
            obstacles = [];
            lastScoreMilestone = 0;
            scoreElement.textContent = '0';
            resetDino();
            createClouds();
            gameOver = false;
            running = true;
            gameOverlay.classList.remove('active');
        }

        function startGame() {
            resetGameState();
            showScreen('game');
            resizeCanvas();
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            running = false;
            gameOver = true;
            const finalScore = Math.floor(score);
            finalScoreElement.textContent = finalScore;

            if (finalScore > highScore) {
                highScore = finalScore;
                try {
                    localStorage.setItem('dino_simple_highscore', String(highScore));
                } catch (e) {}
                highscoreMsg.textContent = '🎉 NEW HIGH SCORE! 🎉';
                highscoreMsg.style.color = '#2ecc71';
            } else {
                highscoreMsg.textContent = `High score: ${highScore}`;
                highscoreMsg.style.color = '#888';
            }

            playCollisionSound();
            playGameOverSound();
            gameOverlay.classList.add('active');
        }

        function jump() {
            if (!running || gameOver) return;
            if (dino.grounded) {
                dino.velocityY = dino.jumpPower;
                dino.grounded = false;
                playJumpSound();
            }
        }

        function updateDino(delta) {
            dino.velocityY += dino.gravity * delta;
            dino.y += dino.velocityY * delta;
            const groundY = getGroundY();
            if (dino.y + dino.height >= groundY) {
                dino.y = groundY - dino.height;
                dino.velocityY = 0;
                dino.grounded = true;
            }
        }

        function updateObstacles(delta) {
            obstacleTimer += delta * 16.67;
            if (obstacleTimer >= nextObstacle) {
                createObstacle();
                obstacleTimer = 0;
                nextObstacle = 700 + Math.random() * 800 - Math.min(score * 1.5, 250);
                nextObstacle = Math.max(nextObstacle, 350);
            }
            for (const ob of obstacles) {
                ob.x -= speed * ob.speedMultiplier * delta;
            }
            obstacles = obstacles.filter(ob => ob.x + ob.width > -40);
        }

        function updateClouds(delta) {
            for (const cloud of clouds) {
                cloud.x -= cloud.speed * delta;
                if (cloud.x + cloud.width < 0) {
                    cloud.x = width + Math.random() * 100;
                    cloud.y = 25 + Math.random() * 80;
                }
            }
        }

        function checkCollision() {
            const padX = 7;
            const padY = 5;
            const dinoBox = {
                x: dino.x + padX,
                y: dino.y + padY,
                width: dino.width - padX * 2,
                height: dino.height - padY * 2
            };
            for (const ob of obstacles) {
                let obBox;
                if (ob.type === 'cloud') {
                    // Cloud floats, so its collision box is smaller and centered
                    obBox = {
                        x: ob.x + 8,
                        y: ob.y + 8,
                        width: ob.width - 16,
                        height: ob.height - 12
                    };
                } else {
                    obBox = {
                        x: ob.x + 4,
                        y: ob.y + 3,
                        width: ob.width - 8,
                        height: ob.height - 3
                    };
                }
                if (
                    dinoBox.x < obBox.x + obBox.width &&
                    dinoBox.x + dinoBox.width > obBox.x &&
                    dinoBox.y < obBox.y + obBox.height &&
                    dinoBox.y + dinoBox.height > obBox.y
                ) {
                    endGame();
                    return;
                }
            }
        }

        function updateScore(delta) {
            score += delta * 0.14;
            const currentScore = Math.floor(score);
            scoreElement.textContent = currentScore;
            speed = 6 + Math.min(currentScore / 90, 7);
            if (currentScore > 0 && currentScore % 50 === 0 && currentScore !== lastScoreMilestone) {
                lastScoreMilestone = currentScore;
                playScoreMilestoneSound();
            }
        }

        function drawBackground() {
            ctx.fillStyle = '#f7f7f7';
            ctx.fillRect(0, 0, width, height);
        }

        function drawCloud(cloud) {
            ctx.fillStyle = '#dcdcdc';
            ctx.beginPath();
            ctx.arc(cloud.x + 16, cloud.y + 16, 14, 0, Math.PI * 2);
            ctx.arc(cloud.x + 34, cloud.y + 10, 20, 0, Math.PI * 2);
            ctx.arc(cloud.x + 56, cloud.y + 16, 14, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawGround() {
            const groundY = getGroundY();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(width, groundY);
            ctx.stroke();
            ctx.strokeStyle = '#777';
            ctx.lineWidth = 1;
            const offset = (performance.now() / 10 * speed) % 40;
            for (let x = -40 + offset; x < width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, groundY + 15);
                ctx.lineTo(x + 16, groundY + 15);
                ctx.stroke();
            }
        }

        function drawDino() {
            const x = dino.x;
            const y = dino.y;
            ctx.fillStyle = '#222';
            ctx.fillRect(x + 8, y + 18, 30, 30);
            ctx.fillRect(x + 22, y, 26, 28);
            ctx.fillRect(x + 40, y + 13, 13, 10);
            const walking = Math.floor(performance.now() / 90) % 2;
            if (dino.grounded && walking === 0) {
                ctx.fillRect(x + 12, y + 45, 8, 13);
                ctx.fillRect(x + 30, y + 45, 8, 8);
            } else {
                ctx.fillRect(x + 12, y + 45, 8, 8);
                ctx.fillRect(x + 30, y + 45, 8, 13);
            }
            ctx.beginPath();
            ctx.moveTo(x + 10, y + 22);
            ctx.lineTo(x - 8, y + 30);
            ctx.lineTo(x + 10, y + 33);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.fillRect(x + 38, y + 6, 4, 4);
        }

        function drawCactusObstacle(ob) {
            const x = ob.x;
            const y = ob.y;
            ctx.fillStyle = '#287a35';
            ctx.fillRect(x + 8, y, ob.width - 16, ob.height);
            if (ob.height > 42) {
                ctx.fillRect(x, y + 15, 10, 20);
                ctx.fillRect(x, y + 15, 16, 8);
                ctx.fillRect(x + ob.width - 10, y + 25, 10, 20);
                ctx.fillRect(x + ob.width - 16, y + 25, 16, 8);
            }
        }

        function drawCloudObstacle(ob) {
            const x = ob.x;
            const y = ob.y;
            // Darker cloud with some gray
            ctx.fillStyle = '#a0a0b0';
            ctx.beginPath();
            ctx.arc(x + 15, y + 15, 12, 0, Math.PI * 2);
            ctx.arc(x + 30, y + 10, 18, 0, Math.PI * 2);
            ctx.arc(x + 45, y + 15, 12, 0, Math.PI * 2);
            ctx.fill();
            // Add darker outline or second layer
            ctx.fillStyle = '#8888a0';
            ctx.beginPath();
            ctx.arc(x + 20, y + 20, 10, 0, Math.PI * 2);
            ctx.arc(x + 35, y + 18, 12, 0, Math.PI * 2);
            ctx.fill();
            // Face?
            ctx.fillStyle = '#555';
            ctx.fillRect(x + 20, y + 15, 4, 4);
            ctx.fillRect(x + 38, y + 15, 4, 4);
        }

        function drawObstacle(ob) {
            if (ob.type === 'cloud') {
                drawCloudObstacle(ob);
            } else {
                drawCactusObstacle(ob);
            }
        }

        function draw() {
            drawBackground();
            for (const cloud of clouds) drawCloud(cloud);
            drawGround();
            drawDino();
            for (const ob of obstacles) drawObstacle(ob);
        }

        function gameLoop(timestamp) {
            if (!running) {
                draw();
                return;
            }
            let delta = (timestamp - lastTime) / 16.67;
            lastTime = timestamp;
            delta = Math.min(delta, 2.5);
            updateDino(delta);
            updateObstacles(delta);
            updateClouds(delta);
            updateScore(delta);
            checkCollision();
            draw();
            if (running) {
                requestAnimationFrame(gameLoop);
            }
        }

        /* =====================================================
           INPUT & BUTTONS
        ===================================================== */
        document.getElementById('startBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            playClickSound();
            startGame();
        });

        document.getElementById('retryBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            playClickSound();
            startGame();
        });

        document.getElementById('menuBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            playClickSound();
            running = false;
            gameOver = true;
            gameOverlay.classList.remove('active');
            showScreen('start');
        });

        // GLOBAL POINTER DOWN (berlaku di seluruh halaman)
        function handleGlobalPointerDown(e) {
            // Jika target adalah tombol di overlay, biarkan tombol yang menangani (sudah stopPropagation)
            if (e.target.closest('button')) {
                return;
            }
            if (gameScreen.classList.contains('active')) {
                if (!running || gameOver) {
                    if (gameOver) {
                        playClickSound();
                        startGame();
                    }
                } else {
                    jump();
                }
            }
        }

        document.addEventListener('pointerdown', handleGlobalPointerDown);

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (gameScreen.classList.contains('active')) {
                    if (!running || gameOver) {
                        if (gameOver) {
                            playClickSound();
                            startGame();
                        }
                    } else {
                        jump();
                    }
                }
            }
        });

        /* =====================================================
           WINDOW EVENTS & INIT
        ===================================================== */
        window.addEventListener('resize', () => {
            if (gameScreen.classList.contains('active')) {
                resizeCanvas();
            }
        });

        function init() {
            showScreen('start');
            resizeCanvas();
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && running) {
                lastTime = performance.now();
            }
        });

        init();

        console.log('🦖 Dino Runner - Simple Edition loaded!');
        console.log('☁️ Awan muncul setelah skor > 200');
        console.log('🖱️ Klik di mana saja (termasuk di luar kotak) untuk lompat / mulai ulang');
    </script>
</body>
</html>
