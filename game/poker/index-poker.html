*{box-sizing:border-box}body{margin:0;background:#071d15;color:#fff;font-family:system-ui}.wrap{max-width:1050px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between}.panel{background:#10281e;border:1px solid #315c49;border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,input{padding:12px;border-radius:10px;border:1px solid #416d5a;font-size:15px}button{background:#d9a72f;font-weight:800;cursor:pointer}.danger{background:#a83939;color:#fff}.secondary{background:#24533e;color:#fff}.token{font:900 27px monospace;letter-spacing:2px}.players{display:grid;gap:7px}.player{padding:10px;background:#17372a;border-radius:10px}.turn{outline:2px solid #ffd166}.cards{display:flex;gap:7px;flex-wrap:wrap}.card{background:white;color:#111;width:58px;height:82px;border-radius:8px;padding:6px;font-size:18px;font-weight:900}.red{color:#c82037}.table{background:radial-gradient(ellipse,#16814f,#0a4a31);min-height:270px;border:8px solid #5d3b22;border-radius:45%;padding:35px 20px;text-align:center}.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.hidden{display:none}.money{color:#ffd166;font-weight:900}@media(max-width:650px){.grid,.actions{grid-template-columns:1fr 1fr}.table{border-radius:30px}}
</style></head><body><div class="wrap"><div class="top"><a href="./index.html" style="color:#9ce6c4">← Profile</a><div>Saldo <span id="money" class="money">...</span></div></div><div id="lobby" class="panel"><h1>♠ Texas Hold'em Online <small style="font-size:14px;opacity:.65">• Poker ID</small></h1><p>Create room menghasilkan token 10 digit. Default buy-in $10.000, maksimal 6 pemain.</p><div class="grid"><button id="create">CREATE ROOM</button><div><input id="code" maxlength="10" inputmode="numeric" placeholder="Token 10 digit"><button id="join" class="secondary">JOIN ROOM</button></div></div><p id="status"></p></div><div id="room" class="hidden"><div class="panel"><div>ROOM <span id="token" class="token"></span> <button id="copy">COPY</button></div><p id="roominfo"></p><button id="start">START GAME (HOST)</button> <button id="leave" class="danger">LEAVE</button></div><div class="panel players" id="players"></div><div class="table"><div>Pot: <b id="pot">$0</b> • Stage: <b id="stage">LOBBY</b></div><div id="community" class="cards" style="justify-content:center;margin:20px"></div><div id="hand" class="cards" style="justify-content:center"></div><p id="turnmsg"></p></div><div class="panel actions"><button id="check">CHECK</button><button id="call">CALL</button><button id="raise">RAISE +1000</button><button id="allin">ALL-IN</button><button id="fold" class="danger">FOLD</button></div></div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getDatabase,ref,get,set,update,remove,onValue,runTransaction,onDisconnect}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';const cfg={apiKey:'AIzaSyBEkpdApRwuDDOInjjVS2p2FWWVD2kpxoM',authDomain:'pokerbj-100d1.firebaseapp.com',databaseURL:'https://pokerbj-100d1-default-rtdb.firebaseio.com',projectId:'pokerbj-100d1',appId:'1:801486572738:web:c6d7545470996adee2bf5b'};const app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app),$=x=>document.getElementById(x);let uid,user,roomId,room,unsub;const fmt=n=>'$'+Number(n||0).toLocaleString('id-ID'),suits=['S','H','D','C'],ranks=['2','3','4','5','6','7','8','9','T','J','Q','K','A'];function deck(){let a=[];for(let s of suits)for(let r of ranks)a.push(r+s);for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function card(c){if(!c)return'';let s={S:'♠',H:'♥',D:'♦',C:'♣'}[c[1]],r=c[0]==='T'?'10':c[0];return `<div class="card ${'HD'.includes(c[1])?'red':''}">${r}<br>${s}</div>`}async function money(delta){let res=await runTransaction(ref(db,`users/${uid}/money`),v=>{v=v||0;if(v+delta<0)return;return v+delta});return res.committed}function token(){return String(Math.floor(1000000000+Math.random()*9000000000))}async function enter(id){roomId=id;$('lobby').classList.add('hidden');$('room').classList.remove('hidden');$('token').textContent=id;onDisconnect(ref(db,`rooms/${id}/players/${uid}/online`)).set(false);unsub=onValue(ref(db,'rooms/'+id),s=>{if(!s.exists()){alert('Room sudah ditutup.');location.href='./index-poker.html';return}room=s.val();render()})}async function addPlayer(id,host=false){let rs=await get(ref(db,'rooms/'+id));if(!rs.exists())throw Error('Room tidak ditemukan.');let r=rs.val(),ps=r.players||{};if(Object.keys(ps).length>=6&&!ps[uid])throw Error('Room penuh.');if(!ps[uid]){if(!(await money(-10000)))throw Error('Saldo minimal $10.000 untuk buy-in.');await set(ref(db,`rooms/${id}/players/${uid}`),{name:user.name,stack:10000,bet:0,folded:false,online:true,joinedAt:Date.now()})}else await update(ref(db,`rooms/${id}/players/${uid}`),{online:true});await enter(id)}$('create').onclick=async()=>{try{let id=token();while((await get(ref(db,'rooms/'+id))).exists())id=token();await set(ref(db,'rooms/'+id),{host:uid,status:'lobby',createdAt:Date.now(),pot:0,currentBet:0,stage:'lobby',turn:0,community:[],deck:[],players:{}});await addPlayer(id,true)}catch(e){$('status').textContent=e.message}};$('join').onclick=async()=>{try{let id=$('code').value.replace(/\D/g,'');if(id.length!==10)throw Error('Token harus 10 digit.');await addPlayer(id)}catch(e){$('status').textContent=e.message}};$('copy').onclick=()=>navigator.clipboard.writeText(roomId);
function active(r=room){return Object.entries(r.players||{}).sort((a,b)=>(a[1].joinedAt||0)-(b[1].joinedAt||0)).filter(x=>!x[1].folded&&x[1].stack>=0)}function render(){let entries=Object.entries(room.players||{}).sort((a,b)=>(a[1].joinedAt||0)-(b[1].joinedAt||0));$('players').innerHTML=entries.map(([id,p],i)=>`<div class="player ${room.status==='playing'&&room.turnUid===id?'turn':''}">${id===room.host?'👑 ':''}${p.name}${id===uid?' (Kamu)':''} — Stack ${fmt(p.stack)} — Bet ${fmt(p.bet)} ${p.folded?' • FOLD':''}</div>`).join('');$('pot').textContent=fmt(room.pot);$('stage').textContent=(room.stage||'lobby').toUpperCase();$('community').innerHTML=(room.community||[]).map(card).join('');let me=room.players?.[uid];$('hand').innerHTML=(me?.hand||[]).map(card).join('');$('start').style.display=room.host===uid&&room.status!=='playing'?'inline-block':'none';let mine=room.turnUid===uid&&room.status==='playing'&&!me?.folded;['check','call','raise','allin','fold'].forEach(x=>$(x).disabled=!mine);$('turnmsg').textContent=room.status==='playing'?(mine?'Giliran kamu.':'Menunggu '+(room.players?.[room.turnUid]?.name||'pemain')+'...'):'Menunggu host memulai game.'}
$('start').onclick=async()=>{if(room.host!==uid)return;let es=Object.entries(room.players||{}).filter(x=>x[1].online!==false&&x[1].stack>0);if(es.length<2)return alert('Minimal 2 pemain.');let dk=deck(),up={};es.forEach(([id,p])=>{up[`players/${id}/hand`]=[dk.pop(),dk.pop()];up[`players/${id}/folded`]=false;up[`players/${id}/bet`]=0});let first=es[0][0];Object.assign(up,{deck:dk,community:[],pot:0,currentBet:0,stage:'preflop',status:'playing',turnUid:first,lastAggressor:first,acted:{}});await update(ref(db,'rooms/'+roomId),up)};
async function act(type){let snap=await get(ref(db,'rooms/'+roomId));let r=snap.val(),p=r?.players?.[uid];if(!r||r.turnUid!==uid||r.status!=='playing'||p.folded)return;let need=Math.max(0,(r.currentBet||0)-(p.bet||0)),pay=0,ups={};if(type==='fold')ups[`players/${uid}/folded`]=true;else if(type==='check'&&need>0)return alert('Tidak bisa check. Harus call/fold.');else if(type==='call'){pay=Math.min(need,p.stack)}else if(type==='raise'){pay=Math.min(need+1000,p.stack);ups.currentBet=(p.bet||0)+pay}else if(type==='allin'){pay=p.stack;ups.currentBet=Math.max(r.currentBet||0,(p.bet||0)+pay)}if(pay){ups[`players/${uid}/stack`]=p.stack-pay;ups[`players/${uid}/bet`]=(p.bet||0)+pay;ups.pot=(r.pot||0)+pay}ups[`acted/${uid}`]=true;await update(ref(db,'rooms/'+roomId),ups);await advance()}['check','call','raise','allin','fold'].forEach(x=>$(x).onclick=()=>act(x));
async function advance(){let s=(await get(ref(db,'rooms/'+roomId))).val();if(!s)return;let es=active(s);if(es.length===1){await award(s,es[0][0]);return}let all=Object.entries(s.players).filter(x=>!x[1].folded),settled=all.every(([id,p])=>(p.bet||0)===(s.currentBet||0)||p.stack===0),acted=all.every(([id])=>s.acted?.[id]);if(settled&&acted){let dk=s.deck||[],com=s.community||[],stage=s.stage;if(stage==='preflop'){com.push(dk.pop(),dk.pop(),dk.pop());stage='flop'}else if(stage==='flop'){com.push(dk.pop());stage='turn'}else if(stage==='turn'){com.push(dk.pop());stage='river'}else if(stage==='river'){await showdown(s);return}let ups={deck:dk,community:com,stage,currentBet:0,acted:{}};for(let [id] of Object.entries(s.players))ups[`players/${id}/bet`]=0;let next=active(s).find(x=>x[1].stack>0)?.[0];ups.turnUid=next;await update(ref(db,'rooms/'+roomId),ups);return}let ids=Object.keys(s.players).sort((a,b)=>s.players[a].joinedAt-s.players[b].joinedAt),idx=ids.indexOf(uid);for(let i=1;i<=ids.length;i++){let id=ids[(idx+i)%ids.length],p=s.players[id];if(!p.folded&&p.stack>0){await update(ref(db,'rooms/'+roomId),{turnUid:id});return}}}
function five(cards){let rv='23456789TJQKA',vals=cards.map(c=>rv.indexOf(c[0])+2).sort((a,b)=>b-a),flush=cards.every(c=>c[1]===cards[0][1]),u=[...new Set(vals)];if(u[0]===14)u.push(1);let high=0;for(let i=0;i<=u.length-5;i++)if(u[i]-u[i+4]===4){high=u[i];break}let cnt={};vals.forEach(v=>cnt[v]=(cnt[v]||0)+1);let groups=Object.entries(cnt).map(([v,n])=>[n,+v]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);let score;if(flush&&high)score=[8,high];else if(groups[0][0]===4)score=[7,groups[0][1],groups[1][1]];else if(groups[0][0]===3&&groups[1]?.[0]===2)score=[6,groups[0][1],groups[1][1]];else if(flush)score=[5,...vals];else if(high)score=[4,high];else if(groups[0][0]===3)score=[3,groups[0][1],...groups.filter(g=>g[0]===1).map(g=>g[1])];else if(groups[0][0]===2&&groups[1]?.[0]===2)score=[2,Math.max(groups[0][1],groups[1][1]),Math.min(groups[0][1],groups[1][1]),groups.find(g=>g[0]===1)?.[1]||0];else if(groups[0][0]===2)score=[1,groups[0][1],...groups.filter(g=>g[0]===1).map(g=>g[1])];else score=[0,...vals];return score}function best(cs){let best=null;for(let a=0;a<cs.length-4;a++)for(let b=a+1;b<cs.length-3;b++)for(let c=b+1;c<cs.length-2;c++)for(let d=c+1;d<cs.length-1;d++)for(let e=d+1;e<cs.length;e++){let q=five([cs[a],cs[b],cs[c],cs[d],cs[e]]);if(!best||cmp(q,best)>0)best=q}return best}function cmp(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){let x=(a[i]||0)-(b[i]||0);if(x)return x}return 0}async function showdown(s){let live=Object.entries(s.players).filter(x=>!x[1].folded),sc=live.map(([id,p])=>[id,best([...(p.hand||[]),...(s.community||[])])]);sc.sort((a,b)=>cmp(b[1],a[1]));let winners=sc.filter(x=>cmp(x[1],sc[0][1])===0).map(x=>x[0]),share=Math.floor((s.pot||0)/winners.length),ups={status:'finished',stage:'showdown',turnUid:null};winners.forEach(id=>ups[`players/${id}/stack`]=(s.players[id].stack||0)+share);await update(ref(db,'rooms/'+roomId),ups);alert('Pemenang: '+winners.map(id=>s.players[id].name).join(', ')+' • '+fmt(share))}async function award(s,id){await update(ref(db,'rooms/'+roomId),{[`players/${id}/stack`]:(s.players[id].stack||0)+(s.pot||0),status:'finished',stage:'winner',turnUid:null});alert(s.players[id].name+' memenangkan pot '+fmt(s.pot))}
$('leave').onclick=async()=>{if(!room)return;let p=room.players?.[uid];if(p?.stack>0)await money(p.stack);await remove(ref(db,`rooms/${roomId}/players/${uid}`));let rest=Object.entries(room.players||{}).filter(x=>x[0]!==uid);if(!rest.length)await remove(ref(db,'rooms/'+roomId));else if(room.host===uid)await update(ref(db,'rooms/'+roomId),{host:rest.sort((a,b)=>a[1].joinedAt-b[1].joinedAt)[0][0]});location.href='./index-poker.html'};onAuthStateChanged(auth,async u=>{if(!u)return location.href='./index.html';uid=u.uid;let us=await get(ref(db,'users/'+uid));user=us.val();onValue(ref(db,`users/${uid}/money`),s=>$('money').textContent=fmt(s.val()))});
</script><footer style="text-align:center;padding:20px;color:#8fa99d;font-size:13px">Poker ID • Credit: Mas-IP</footer></body></html>
