<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poker ID</title><style>
:root{--bg:#07130f;--card:#10241c;--line:#28513e;--gold:#ffd166;--text:#f5f7f6;--muted:#9fb5aa}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:radial-gradient(circle at top,#174b35,#07130f 55%);color:var(--text);min-height:100vh}.wrap{max-width:850px;margin:auto;padding:24px}.panel{background:#0d2119e8;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 20px 60px #0008;margin:20px 0}h1,h2{margin:.2em 0}.muted{color:var(--muted)}input,button{width:100%;padding:14px;border-radius:12px;border:1px solid #315a48;margin:7px 0;font-size:16px}input{background:#071711;color:white}button{background:#1f7a55;color:white;font-weight:800;cursor:pointer}button.secondary{background:#17382b}.money{font-size:32px;color:var(--gold);font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.game{padding:22px;border-radius:18px;background:#143c2b;border:1px solid #397258;cursor:pointer}.hidden{display:none}.err{color:#ff8f8f}.ok{color:#87e8b4}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><h1>♠ Poker ID</h1><p class="muted">Blackjack & Texas Hold'em</p>
<section id="auth" class="panel"><h2>Masuk / Daftar</h2><p class="muted">Gunakan nama pemain dan sandi. Akun baru mendapat $100.000.</p><input id="name" maxlength="20" placeholder="Nama pemain"><input id="pass" type="password" minlength="6" placeholder="Sandi (min. 6 karakter)"><button id="login">Masuk</button><button id="register" class="secondary">Daftar akun baru</button><p id="msg"></p></section>
<section id="profile" class="panel hidden"><h2 id="hello">Profile</h2><div class="money" id="money">$0</div><p class="muted">Saldo yang sama digunakan untuk Blackjack dan Poker.</p><div class="grid"><div class="game" onclick="location.href='./index-bj.html'"><h2>🎰 Blackjack</h2><p>Lawan dealer AI.</p></div><div class="game" onclick="location.href='./index-poker.html'"><h2>♠ Texas Hold'em</h2><p>Multiplayer online dengan room token.</p></div></div><button id="logout" class="secondary">Keluar</button></section></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getDatabase,ref,get,set,onValue}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
const cfg={apiKey:'AIzaSyBEkpdApRwuDDOInjjVS2p2FWWVD2kpxoM',authDomain:'pokerbj-100d1.firebaseapp.com',databaseURL:'https://pokerbj-100d1-default-rtdb.firebaseio.com',projectId:'pokerbj-100d1',storageBucket:'pokerbj-100d1.firebasestorage.app',messagingSenderId:'801486572738',appId:'1:801486572738:web:c6d7545470996adee2bf5b'};const app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app);const $=x=>document.getElementById(x),email=n=>`${n.trim().toLowerCase().replace(/[^a-z0-9_.-]/g,'_')}@pokerid.local`,fmt=n=>'$'+Number(n||0).toLocaleString('id-ID');
$('register').onclick=async()=>{try{let n=$('name').value.trim(),p=$('pass').value;if(n.length<3)throw Error('Nama minimal 3 karakter.');let key=n.toLowerCase(),snap=await get(ref(db,'names/'+key));if(snap.exists())throw Error('Nama sudah dipakai.');let c=await createUserWithEmailAndPassword(auth,email(n),p);await set(ref(db,'users/'+c.user.uid),{name:n,money:100000,createdAt:Date.now()});await set(ref(db,'names/'+key),c.user.uid)}catch(e){$('msg').textContent=e.message;$('msg').className='err'}};
$('login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,email($('name').value),$('pass').value)}catch(e){$('msg').textContent='Nama atau sandi salah.';$('msg').className='err'}};$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(!u){$('auth').classList.remove('hidden');$('profile').classList.add('hidden');return}$('auth').classList.add('hidden');$('profile').classList.remove('hidden');onValue(ref(db,'users/'+u.uid),s=>{let d=s.val()||{};$('hello').textContent='👤 '+(d.name||'Player');$('money').textContent=fmt(d.money)})});
</script><footer style="text-align:center;padding:20px;color:#8fa99d;font-size:13px">Poker ID • Credit: Mas-IP</footer></body></html>
