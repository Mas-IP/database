<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media Downloader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }
    h2 {
      margin-bottom: 8px;
      color: #38bdf8;
    }
    p.desc {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #38bdf8;
    }
    button {
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #0284c7;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    #result {
      margin-top: 24px;
      display: none;
    }
    .download-btn {
      display: inline-block;
      width: 100%;
      padding: 12px;
      background: #22c55e;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 10px;
    }
    .download-btn:hover {
      background: #16a34a;
    }
    .error {
      color: #ef4444;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>All Social Downloader</h2>
    <p class="desc">Tempel link YouTube, TikTok, IG, FB, atau Twitter di bawah ini.</p>

    <div class="input-group">
      <input type="text" id="videoUrl" placeholder="https://www.tiktok.com/@user/video/..." />
      <button id="btnProcess" onclick="processDownload()">Proses Link</button>
    </div>

    <div id="errorMsg" class="error"></div>

    <div id="result">
      <p style="margin-bottom: 10px; color: #cbd5e1;">Media Siap Diunduh!</p>
      <a id="downloadLink" href="#" target="_blank" class="download-btn">Download Sekarang</a>
    </div>
  </div>

  <script>
    async function processDownload() {
      const urlInput = document.getElementById('videoUrl').value.trim();
      const btn = document.getElementById('btnProcess');
      const errorMsg = document.getElementById('errorMsg');
      const resultDiv = document.getElementById('result');
      const downloadLink = document.getElementById('downloadLink');

      // Reset status
      errorMsg.innerText = '';
      resultDiv.style.display = 'none';

      if (!urlInput) {
        errorMsg.innerText = 'Harap masukkan link media terlebih dahulu!';
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Mengekstrak Video...';

      try {
        // Memanggil Public API Cobalt
        const response = await fetch('https://api.cobalt.tools/api/json', {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            url: urlInput
          })
        });

        const data = await response.json();

        if (data.status === 'stream' || data.status === 'redirect') {
          downloadLink.href = data.url;
          resultDiv.style.display = 'block';
        } else if (data.status === 'picker') {
          // Jika terdapat beberapa opsi file (seperti galeri foto/slide)
          downloadLink.href = data.picker[0].url;
          resultDiv.style.display = 'block';
        } else {
          errorMsg.innerText = data.text || 'Gagal mengambil video. Pastikan link valid dan publik!';
        }
      } catch (err) {
        errorMsg.innerText = 'Terjadi kesalahan koneksi ke API server.';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Proses Link';
      }
    }
  </script>

</body>
</html>
